<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 420" width="260" height="420">
  <defs>
    <linearGradient id="hcap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f3d05"/>
      <stop offset=".2" stop-color="#ffb273"/>
      <stop offset=".45" stop-color="#ff751f"/>
      <stop offset=".7" stop-color="#ffd9b8"/>
      <stop offset="1" stop-color="#8f3d05"/>
    </linearGradient>
    <linearGradient id="hliquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4d92"/>
      <stop offset=".5" stop-color="#2a2158"/>
      <stop offset="1" stop-color="#0b0820"/>
    </linearGradient>
    <linearGradient id="hglass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset=".65" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="hstreak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hglow" cx=".5" cy=".55" r=".6">
      <stop offset="0" stop-color="#7a6fc0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7a6fc0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="130" cy="130" rx="150" ry="190" fill="url(#hglow)"/>

  <ellipse cx="130" cy="392" rx="78" ry="14" fill="#000" opacity=".4"/>

  <!-- Cap -->
  <rect x="104" y="16" width="52" height="72" rx="8" fill="url(#hcap)"/>
  <rect x="104" y="16" width="52" height="72" rx="8" fill="none" stroke="#7a3304" stroke-width="1.2"/>
  <rect x="112" y="24" width="10" height="56" rx="5" fill="#fff" opacity=".4"/>
  <rect x="104" y="88" width="52" height="8" rx="2" fill="url(#hcap)"/>
  <rect x="112" y="96" width="36" height="14" rx="3" fill="#2a2158"/>
  <rect x="118" y="6" width="24" height="12" rx="4" fill="url(#hcap)"/>

  <!-- Throat -->
  <path d="M112 110 h36 v22 h-36 z" fill="#241d4e"/>
  <path d="M112 110 h36 v6 h-36 z" fill="#fff" opacity=".15"/>

  <!-- Body -->
  <path d="M52 132 q-10 112 8 236 h140 q18-124 8-236 q-40-22 -78 0 z" fill="url(#hliquid)"/>
  <path d="M52 132 q-10 112 8 236 h140 q18-124 8-236 q-40-22 -78 0 z" fill="url(#hglass)"/>
  <path d="M60 136 q-8 108 6 228 h128 q14-120 6-228 q-36-20 -70 0 z" fill="none" stroke="#ff751f" stroke-width="2.4"/>

  <!-- Highlights -->
  <path d="M70 142 q-4 92 3 182 l18 3 q-6-100 -2-185 z" fill="url(#hstreak)"/>
  <path d="M186 148 q5 84 1 164 l-13-2 q4-86 0-162 z" fill="#fff" opacity=".13"/>
  <ellipse cx="130" cy="130" rx="78" ry="10" fill="#8a7fd0" opacity=".4"/>

  <!-- Label -->
  <circle cx="130" cy="252" r="42" fill="#0d0a24" opacity=".55"/>
  <circle cx="130" cy="252" r="42" fill="none" stroke="#ff751f" stroke-width="2"/>
  <circle cx="130" cy="252" r="35" fill="none" stroke="#ff751f" stroke-width=".8" opacity=".7"/>
  <text x="130" y="247" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#ffb273" letter-spacing="3">MAISON</text>
  <text x="130" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ffb273" letter-spacing="2">LUMIÈRE</text>
  <path d="M114 258 h32" stroke="#ff751f" stroke-width="1" opacity=".8"/>

  <!-- Gold bands -->
  <path d="M56 128 h148" stroke="#ffb273" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M58 368 h144" stroke="#ffb273" stroke-width="2.6" stroke-linecap="round"/>
